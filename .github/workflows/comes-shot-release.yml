name: Comes Shot release

# Every push that touches comes-shot/ builds the app. If Cargo.toml has a
# version that has not been released yet, it publishes the release
# "comes-shot-vX.Y.Z" with ComesShot.exe, which installed apps pick up and
# install automatically.
#
# The tag never starts with "v" (that would trigger ComesADE's signed builds)
# and the release is never marked Latest (ComesADE's updater reads
# releases/latest).

on:
  push:
    branches: [main]
    paths:
      - 'comes-shot/**'
      - '.github/workflows/comes-shot-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comes-shot-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: comes-shot
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "comes-shot-v$v" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "comes-shot-v$v ya está publicada: solo se compila y se prueba."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            comes-shot/target
          key: comes-shot-${{ runner.os }}-${{ hashFiles('comes-shot/Cargo.lock') }}

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        run: |
          v="${{ steps.version.outputs.version }}"
          cp target/release/ComesShot.exe ComesShot.exe
          sha256sum ComesShot.exe | cut -d ' ' -f1 > ComesShot.exe.sha256
          gh release create "comes-shot-v$v" ComesShot.exe ComesShot.exe.sha256 \
            --target "${{ github.sha }}" \
            --title "Comes Shot $v" \
            --notes "Comes Shot $v para Windows. Las copias instaladas se actualizan solas." \
            --latest=false
