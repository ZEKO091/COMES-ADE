name: Signed desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: signed-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows signed bundle
    runs-on: windows-latest
    env:
      WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_CERT_THUMBPRINT }}
      WINDOWS_SIGNING_TIMESTAMP_URL: https://timestamp.digicert.com
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify updater signing configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Falta TAURI_SIGNING_PRIVATE_KEY para generar los artefactos del updater.'
          }

      - name: Import Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_THUMBPRINT)) { throw 'Falta WINDOWS_SIGNING_CERT_THUMBPRINT.' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) { throw 'Falta WINDOWS_SIGNING_CERTIFICATE_BASE64.' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) { throw 'Falta WINDOWS_SIGNING_CERTIFICATE_PASSWORD.' }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'comesade-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password
            $expectedThumbprint = ($env:WINDOWS_SIGNING_CERT_THUMBPRINT -replace ' ', '').ToUpperInvariant()
            if ($certificate.Thumbprint -ne $expectedThumbprint) { throw 'La huella del certificado importado no coincide con WINDOWS_SIGNING_CERT_THUMBPRINT.' }
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Install dependencies
        run: npm ci

      - name: Build and sign
        run: npm run build:windows:signed

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ComesADE-windows-${{ github.sha }}
          if-no-files-found: error
          path: src-tauri/target/release/bundle/**

      - name: Package web dist and checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = if ($tag.StartsWith('v')) { $tag.Substring(1) } else { $tag }
          $outDir = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $distZip = Join-Path $outDir "ComesADE-web-dist-$tag.zip"
          Compress-Archive -Path 'dist\*' -DestinationPath $distZip -Force

          $stableInstaller = Join-Path $outDir 'ComesADE-Setup.exe'
          $builtInstaller = "src-tauri\target\release\bundle\nsis\ComesADE_${version}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $builtInstaller -PathType Leaf)) { throw "Falta instalador NSIS firmado: $builtInstaller" }
          Copy-Item -LiteralPath $builtInstaller -Destination $stableInstaller -Force

          $checksumFile = Join-Path $outDir "SHA256SUMS-$tag.txt"
          $targets = @(
            $stableInstaller,
            "src-tauri\target\release\bundle\msi\ComesADE_${version}_x64_en-US.msi",
            "src-tauri\target\release\bundle\nsis\ComesADE_${version}_x64-setup.exe",
            $distZip
          )

          $lines = foreach ($target in $targets) {
            if (-not (Test-Path $target)) { throw "Falta asset esperado: $target" }
            $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($target))"
          }
          Set-Content -Path $checksumFile -Value $lines

      - name: Upload release metadata assets
        uses: actions/upload-artifact@v4
        with:
          name: ComesADE-release-assets-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release-assets/**

  macos:
    name: macOS signed and notarized bundle (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify updater signing configuration
        shell: bash
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Verify Apple signing configuration
        shell: bash
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_TEAM_ID"

      - name: Prepare App Store Connect key
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_BASE64"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build, sign and notarize
        run: npm run build:macos:signed

      - name: Prepare macOS updater assets
        shell: bash
        run: |
          staging="$RUNNER_TEMP/comesade-macos-assets"
          rm -rf "$staging"
          mkdir -p "$staging"
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            case "$name" in
              *.app.tar.gz.sig)
                if [[ "$name" != *aarch64* && "$name" != *x86_64* ]]; then
                  name="${name%.app.tar.gz.sig}_${TAURI_TARGET}.app.tar.gz.sig"
                fi
                ;;
              *.app.tar.gz)
                if [[ "$name" != *aarch64* && "$name" != *x86_64* ]]; then
                  name="${name%.app.tar.gz}_${TAURI_TARGET}.app.tar.gz"
                fi
                ;;
              *.dmg)
                if [[ "$name" != *aarch64* && "$name" != *x86_64* ]]; then
                  name="${name%.dmg}_${TAURI_TARGET}.dmg"
                fi
                ;;
              *) continue ;;
            esac
            cp "$file" "$staging/$name"
          done < <(find src-tauri/target -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -print0)
          test -n "$(find "$staging" -type f -print -quit)"

      - name: Upload signed macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ComesADE-macos-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/comesade-macos-assets/**

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate updater manifest
        run: node scripts/generate-updater-manifest.mjs --input release-artifacts --output release-artifacts/latest.json --repository "${{ github.repository }}" --tag "${{ github.ref_name }}"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*
