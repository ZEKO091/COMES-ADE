name: Signed desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Public GitHub App client ID used by the desktop Device Flow.
  VITE_GITHUB_CLIENT_ID: Ov23likU101MbFvs0gWw

concurrency:
  group: signed-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows updater bundle
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify updater signing configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Falta TAURI_SIGNING_PRIVATE_KEY para generar los artefactos del updater.'
          }

      - name: Install dependencies
        run: npm ci

      - name: Build updater bundle
        run: npm run build:windows:updater

      - name: Upload Windows updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ComesADE-windows-${{ github.sha }}
          if-no-files-found: error
          path: src-tauri/target/release/bundle/**

      - name: Package web dist and checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = if ($tag.StartsWith('v')) { $tag.Substring(1) } else { $tag }
          $outDir = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $distZip = Join-Path $outDir "ComesADE-web-dist-$tag.zip"
          Compress-Archive -Path 'dist\*' -DestinationPath $distZip -Force

          $stableInstaller = Join-Path $outDir 'ComesADE-Setup.exe'
          $builtInstaller = "src-tauri\target\release\bundle\nsis\ComesADE_${version}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $builtInstaller -PathType Leaf)) { throw "Falta instalador NSIS del updater: $builtInstaller" }
          Copy-Item -LiteralPath $builtInstaller -Destination $stableInstaller -Force

          $checksumFile = Join-Path $outDir "SHA256SUMS-$tag.txt"
          $targets = @(
            $stableInstaller,
            "src-tauri\target\release\bundle\msi\ComesADE_${version}_x64_en-US.msi",
            "src-tauri\target\release\bundle\nsis\ComesADE_${version}_x64-setup.exe",
            $distZip
          )

          $lines = foreach ($target in $targets) {
            if (-not (Test-Path $target)) { throw "Falta asset esperado: $target" }
            $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($target))"
          }
          Set-Content -Path $checksumFile -Value $lines

      - name: Upload release metadata assets
        uses: actions/upload-artifact@v4
        with:
          name: ComesADE-release-assets-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release-assets/**

  macos:
    name: macOS app, DMG and updater bundle (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify updater signing configuration
        shell: bash
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Install dependencies
        run: npm ci

      - name: Build updater bundle
        run: npm run build:macos:updater

      - name: Prepare macOS updater assets
        shell: bash
        run: |
          staging="$RUNNER_TEMP/comesade-macos-assets"
          rm -rf "$staging"
          mkdir -p "$staging"

          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            case "$name" in
              *.app.tar.gz.sig)
                if [[ "$name" != *aarch64* && "$name" != *x86_64* ]]; then
                  name="${name%.app.tar.gz.sig}_${TAURI_TARGET}.app.tar.gz.sig"
                fi
                ;;
              *.app.tar.gz)
                if [[ "$name" != *aarch64* && "$name" != *x86_64* ]]; then
                  name="${name%.app.tar.gz}_${TAURI_TARGET}.app.tar.gz"
                fi
                ;;
              *) continue ;;
            esac
            cp "$file" "$staging/$name"
          done < <(find src-tauri/target -type f \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -print0)

          # Publish both the portable .app zip and the Finder installer .dmg.
          if [[ "$TAURI_TARGET" == "aarch64-apple-darwin" ]]; then
            app_stable="ComesADE-arm64.app.zip"
            dmg_stable="ComesADE-arm64.dmg"
          elif [[ "$TAURI_TARGET" == "x86_64-apple-darwin" ]]; then
            app_stable="ComesADE-x64.app.zip"
            dmg_stable="ComesADE-x64.dmg"
          else
            echo "TAURI_TARGET no soportado para alias estable: $TAURI_TARGET" >&2
            exit 1
          fi

          app_path="$(find src-tauri/target -type d -name 'ComesADE.app' | head -n 1)"
          if [[ -z "$app_path" ]]; then
            echo "No se encontró ComesADE.app en el build." >&2
            find src-tauri/target -type d -name '*.app' -print || true
            exit 1
          fi
          dmg_path="$(find src-tauri/target -type f -name '*.dmg' | head -n 1)"
          if [[ -z "$dmg_path" ]]; then
            echo "No se encontrÃ³ el .dmg generado." >&2
            find src-tauri/target -type f -name '*.dmg' -print || true
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$staging/$app_stable"
          cp "$dmg_path" "$staging/$dmg_stable"

          test -n "$(find "$staging" -type f -print -quit)"
          ls -la "$staging"

      - name: Upload macOS updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ComesADE-macos-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/comesade-macos-assets/**

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate updater manifest
        run: node scripts/generate-updater-manifest.mjs --input release-artifacts --output release-artifacts/latest.json --repository "${{ github.repository }}" --tag "${{ github.ref_name }}"

      - name: Flatten stable Mac apps
        shell: bash
        run: |
          mkdir -p release-artifacts/macos-apps
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            case "$name" in
              ComesADE-arm64.app.zip|ComesADE-x64.app.zip)
                cp -f "$file" "release-artifacts/macos-apps/$name"
                ;;
            esac
          done < <(find release-artifacts -type f -name 'ComesADE-*.app.zip' -print0)
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            case "$name" in
              ComesADE-arm64.dmg|ComesADE-x64.dmg)
                cp -f "$file" "release-artifacts/macos-apps/$name"
                ;;
            esac
          done < <(find release-artifacts -type f -name 'ComesADE-*.dmg' -print0)
          if ! find release-artifacts/macos-apps -type f -name 'ComesADE-*.app.zip' | grep -q .; then
            echo "Faltan apps Mac estables (ComesADE-arm64.app.zip / ComesADE-x64.app.zip)." >&2
            find release-artifacts -type f \( -name '*.app.zip' -o -name '*.app.tar.gz' \) -print || true
            exit 1
          fi
          if ! find release-artifacts/macos-apps -type f -name 'ComesADE-*.dmg' | grep -q .; then
            echo "Faltan instaladores Mac DMG (ComesADE-arm64.dmg / ComesADE-x64.dmg)." >&2
            find release-artifacts -type f -name '*.dmg' -print || true
            exit 1
          fi
          for asset in \
            ComesADE-arm64.app.zip \
            ComesADE-x64.app.zip \
            ComesADE-arm64.dmg \
            ComesADE-x64.dmg
          do
            if [[ ! -f "release-artifacts/macos-apps/$asset" ]]; then
              echo "Falta asset Mac obligatorio: $asset" >&2
              exit 1
            fi
          done

          # Each matrix artifact contains a copy of its stable installer. Keep
          # only the normalized copies to avoid duplicate GitHub Release names.
          find release-artifacts -mindepth 2 -type f \
            \( -name 'ComesADE-arm64.app.zip' -o -name 'ComesADE-x64.app.zip' \
            -o -name 'ComesADE-arm64.dmg' -o -name 'ComesADE-x64.dmg' \) \
            ! -path 'release-artifacts/macos-apps/*' -delete
          ls -la release-artifacts/macos-apps

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*
