name: Build macOS

on:
  workflow_dispatch:

env:
  # Public GitHub App client ID used by the desktop Device Flow.
  VITE_GITHUB_CLIENT_ID: Ov23likU101MbFvs0gWw

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri macOS (.app + .dmg)
        # Local config skips updater signatures and uses ad-hoc macOS signing.
        run: npm run tauri build -- --config src-tauri/tauri.local.conf.json --bundles app,dmg

      - name: Package ComesADE.app.zip and ComesADE.dmg
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target -type d -name 'ComesADE.app' | head -n 1)"
          if [[ -z "$app_path" ]]; then
            echo "No se encontró ComesADE.app"
            find src-tauri/target -type d -name '*.app' -print || true
            exit 1
          fi
          dmg_path="$(find src-tauri/target -type f -name '*.dmg' | head -n 1)"
          if [[ -z "$dmg_path" ]]; then
            echo "No se encontrÃ³ el .dmg generado"
            find src-tauri/target -type f -name '*.dmg' -print || true
            exit 1
          fi
          case "$(uname -m)" in
            arm64|aarch64) suffix="arm64" ;;
            x86_64|amd64) suffix="x64" ;;
            *) echo "Arquitectura macOS no soportada: $(uname -m)"; exit 1 ;;
          esac
          mkdir -p dist-macos
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "dist-macos/ComesADE-${suffix}.app.zip"
          cp "$dmg_path" "dist-macos/ComesADE-${suffix}.dmg"
          echo "Packaged from: $app_path"
          echo "DMG from: $dmg_path"
          ls -la dist-macos

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macOS-build
          path: |
            dist-macos/**
            src-tauri/target/release/bundle/macos/**
            src-tauri/target/*/release/bundle/macos/**
          if-no-files-found: error
